specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: API Dash
providerId: api-dash
generated: '2026-09-02'
method: probed
source: live unauthenticated GET https://api.apidash.dev/country/codes + https://api.apidash.dev/openapi.json
created: '2026-05-04'
modified: '2026-09-02'
limit_count: 0
limits: []
headers: {}
responseCodes: {}
description: >-
  API Dash documents no rate limits, and its API returns no rate-limit signal at runtime. An honest
  zero, measured two ways on 2026-09-02: the contract declares no 429 response on any of its 57
  operations, and a live unauthenticated call returned no RateLimit-*, X-RateLimit-* or Retry-After
  header. The response carried only date, content-type, content-length, server: cloudflare and
  Cloudflare edge headers (cf-ray, cf-cache-status, alt-svc, nel/report-to). Cloudflare sits in
  front of the origin and may enforce edge protection, but nothing the provider publishes tells a
  consumer what that threshold is, so an agent has no runtime budget to plan against.
supersedes:
  what: >-
    Five invented per-tier limits (10/100/1000 requests per minute, 1,000 and 100,000 per month),
    an invented burst ceiling, an invented X-RateLimit-*/RateLimit-Policy header set and four
    invented policy paragraphs, written by the 2026-05-04 bulk sweep and carrying method:generated.
  why: >-
    None of it was published by API Dash. It read as the provider's documented throttling contract
    and would have taught an agent to expect headers this API does not send. Replaced with the
    measured zero on 2026-09-02.
evidence:
- url: https://api.apidash.dev/country/codes
  http_status: 200
  observed_headers: [date, content-type, content-length, server, cf-cache-status, report-to, nel, cf-ray, alt-svc]
  rate_limit_headers_present: false
- url: https://api.apidash.dev/openapi.json
  http_status: 200
  declared_429_responses: 0
  note: The only error status declared anywhere in the contract is 422.
