- aid: api-dash:api-dash-apis
  name: API Dash APIs
  description: >-
    The API Dash APIs are a free, keyless, open-source REST utility API published by foss42
    alongside the API Dash client and served from the company's own host at api.apidash.dev.
    OpenAPI 3.1.0, 57 operations across eight tags: country data (ISO 3166-1 codes, names,
    official names, flags, geographic and demographic data, subdivisions), text conversion,
    case conversion, humanization of numbers and dates, a purpose-built /io family for
    exercising an HTTP client (delay, multipart, file upload, HEAD, octet-stream, full verb
    coverage), a Server-Sent Events stream, and OAuth2 password-flow login over a sample user
    dataset. 52 of the 57 operations require no credential of any kind.
  humanURL: https://api.apidash.dev/docs
