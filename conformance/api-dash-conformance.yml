generated: '2026-09-02'
method: derived
source: openapi/api-dash-openapi.yml + https://github.com/foss42/apidash (AGENTS.md, doc/user_guide/, packages/)
note: >-
  API Dash sits on both sides of this artifact and the two must not be blurred, so they are kept
  in separate blocks. `api_standards` is what the PROVIDER'S OWN API at api.apidash.dev conforms
  to as a contract. `client_interoperability` is what the API DASH CLIENT can speak as a
  consumer — the interchange formats it imports/exports and the wire protocols it can drive.
  The second block is the more interesting half for this company and it is the domain-standard
  signature for its market: an API client's market standards ARE the interchange formats, and
  API Dash implements them as first-party Dart packages published to pub.dev, which is evidence
  a marketing claim could not supply. It earns no `Compliance` pointer either way: the provider
  publishes no certification program (no SOC 2 / ISO 27001 / trust center), and asserting one
  from these would be a fabrication.
api_standards:
- id: openapi-3.1
  conforms: true
  evidence: https://api.apidash.dev/openapi.json declares openapi 3.1.0 with 57 operations, 9 component schemas, all operations carrying a unique operationId, summary and tag.
- id: oauth2
  conforms: partial
  evidence: >-
    components.securitySchemes.OAuth2PasswordBearer is type oauth2 with a `password` flow, applied
    to 5 operations. It declares zero scopes, and its tokenUrl is "/login" while the operation that
    mints the token is POST /auth/login — a client resolving the declared tokenUrl against the
    server base would hit a path that does not exist. Recorded partial for that reason.
