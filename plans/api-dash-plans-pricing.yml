description: >-
  API Dash publishes no plans and charges no money. Both surfaces are free: the desktop/mobile
  client is Apache-2.0 open source distributed as installers from GitHub Releases, and the API Dash
  APIs at api.apidash.dev are keyless and free ("Open Source APIs for all!" — the OpenAPI's own
  info.description). There is no pricing page, no sign-up, no metering and no enterprise contact
  form. plan_count is 0 because that is the measurement, not because the page could not be found.
supersedes:
  what: >-
    A three-tier Free / Professional / Enterprise scaffold with invented request quotas (1,000 and
    100,000 per month), invented per-minute rate limits and `price: TBD` placeholders, written by
    the 2026-05-04 bulk sweep and carrying method:generated.
  why: >-
    None of it was ever published by API Dash. It described a metered commercial API for a company
    that sells nothing, and it would have been read as the provider's own pricing. Replaced with the
    measured zero on 2026-09-02.
